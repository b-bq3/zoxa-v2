<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Ring dash pattern -->
    <pattern id="dash" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="4" height="8" fill="white" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Ring 1: Thin dashed -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- Ring 2: Medium solid - broken segment -->
  <path d="M 56,256 A 200,200 0 0,1 456,256" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <path d="M 300,444 A 200,200 0 0,1 200,444" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="2,6"/>

  <!-- Ring 3: Inner solid -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Ring 4: Inner dashed -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,6"/>

  <!-- Radial lines (clock hands) -->
  <g opacity="0.15" stroke="white" stroke-width="1">
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="131" y1="131" x2="381" y2="381"/>
    <line x1="131" y1="381" x2="381" y2="131"/>
  </g>

  <!-- Additional radial lines -->
  <g opacity="0.08" stroke="white" stroke-width="0.5">
    <line x1="256" y1="50" x2="256" y2="462"/>
    <line x1="50" y1="256" x2="462" y2="256"/>
    <line x1="106" y1="106" x2="406" y2="406"/>
    <line x1="106" y1="406" x2="406" y2="106"/>
  </g>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="30" fill="rgba(255,255,255,0.03)"/>
  <circle cx="256" cy="256" r="15" fill="rgba(255,255,255,0.06)"/>

  <!-- ZOXA Text with glow -->
  <text x="256" y="268" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="112" font-weight="900" fill="white" text-anchor="middle" filter="url(#glow)" letter-spacing="4">ZOXA</text>

  <!-- Text reflection -->
  <text x="256" y="268" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="112" font-weight="900" fill="white" text-anchor="middle" opacity="0.08" transform="scale(1,-1) translate(0,-536)" letter-spacing="4">ZOXA</text>

  <!-- Red accent dot -->
  <circle cx="256" cy="340" r="4" fill="#dc2626" filter="url(#glow)"/>

  <!-- Subtle outer glow ring -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="rgba(220,38,38,0.06)" stroke-width="1"/>
</svg>